# Raw label -> canonical label, one table per label_set (see sources.yaml).
#
# Keys are *normalized* raw labels: lowercased, every run of characters other
# than a-z/0-9 replaced by "_", leading/trailing "_" stripped. So the folder
# "Corn_(maize)___Common_rust_" becomes "corn_maize_common_rust".
#
# Values are "<crop>__<condition>". The part before "__" decides which crop
# expert the image goes to. A value of null drops the label on purpose.
# Labels missing from a table are dropped too, but listed in report.json and
# by --inspect so nothing disappears silently.

plantvillage:
  apple_apple_scab: apple__scab
  apple_black_rot: apple__black_rot
  apple_cedar_apple_rust: apple__cedar_apple_rust
  apple_healthy: apple__healthy
  blueberry_healthy: blueberry__healthy
  cherry_including_sour_powdery_mildew: cherry__powdery_mildew
  cherry_including_sour_healthy: cherry__healthy
  corn_maize_cercospora_leaf_spot_gray_leaf_spot: maize__gray_leaf_spot
  corn_maize_common_rust: maize__common_rust
  corn_maize_northern_leaf_blight: maize__northern_leaf_blight
  corn_maize_healthy: maize__healthy
  grape_black_rot: grape__black_rot
  grape_esca_black_measles: grape__esca
  grape_leaf_blight_isariopsis_leaf_spot: grape__leaf_blight
  grape_healthy: grape__healthy
  orange_haunglongbing_citrus_greening: orange__citrus_greening
  peach_bacterial_spot: peach__bacterial_spot
  peach_healthy: peach__healthy
  pepper_bell_bacterial_spot: pepper__bacterial_spot
  pepper_bell_healthy: pepper__healthy
  potato_early_blight: potato__early_blight
  potato_late_blight: potato__late_blight
  potato_healthy: potato__healthy
  raspberry_healthy: raspberry__healthy
  soybean_healthy: soybean__healthy
  squash_powdery_mildew: squash__powdery_mildew
  strawberry_leaf_scorch: strawberry__leaf_scorch
  strawberry_healthy: strawberry__healthy
  tomato_bacterial_spot: tomato__bacterial_spot
  tomato_early_blight: tomato__early_blight
  tomato_late_blight: tomato__late_blight
  tomato_leaf_mold: tomato__leaf_mold
  tomato_septoria_leaf_spot: tomato__septoria_leaf_spot
  tomato_spider_mites_two_spotted_spider_mite: tomato__spider_mites
  tomato_target_spot: tomato__target_spot
  tomato_tomato_yellow_leaf_curl_virus: tomato__yellow_leaf_curl_virus
  tomato_tomato_mosaic_virus: tomato__mosaic_virus
  tomato_healthy: tomato__healthy
  # Unlabeled test folder shipped with the augmented Kaggle copy.
  test: null

# Makerere AI Lab competition: label ids from train.csv, names from
# label_num_to_disease_map.json. Both spellings are listed.
cassava_competition:
  "0": cassava__bacterial_blight
  "1": cassava__brown_streak_disease
  "2": cassava__green_mottle
  "3": cassava__mosaic_disease
  "4": cassava__healthy
  cassava_bacterial_blight_cbb: cassava__bacterial_blight
  cassava_brown_streak_disease_cbsd: cassava__brown_streak_disease
  cassava_green_mottle_cgm: cassava__green_mottle
  cassava_mosaic_disease_cmd: cassava__mosaic_disease
  healthy: cassava__healthy

maize_field:
  blight: maize__northern_leaf_blight
  common_rust: maize__common_rust
  gray_leaf_spot: maize__gray_leaf_spot
  healthy: maize__healthy

tea_sickness:
  algal_leaf: tea__algal_leaf_spot
  anthracnose: tea__anthracnose
  bird_eye_spot: tea__bird_eye_spot
  brown_blight: tea__brown_blight
  gray_light: tea__gray_blight
  gray_blight: tea__gray_blight
  healthy: tea__healthy
  red_leaf_spot: tea__red_leaf_spot
  white_spot: tea__white_spot

# RoCoLe multiclass labels. Rust severity levels are merged into one class;
# the app reports "rust", not a severity grade.
rocole:
  healthy: coffee__healthy
  rust_level_1: coffee__leaf_rust
  rust_level_2: coffee__leaf_rust
  rust_level_3: coffee__leaf_rust
  rust_level_4: coffee__leaf_rust
  rust: coffee__leaf_rust
  red_spider_mite: coffee__red_spider_mite

cashew:
  anthracnose: cashew__anthracnose
  gumosis: cashew__gummosis
  gummosis: cashew__gummosis
  healthy: cashew__healthy
  leaf_miner: cashew__leaf_miner
  red_rust: cashew__red_rust

# FieldPlant has 27 detection classes whose exact spelling is unconfirmed.
# Run `python dataset_factory.py --inspect fieldplant` and add entries here,
# e.g.  cassava_mosaic: cassava__mosaic_disease
#       corn_blight:    maize__northern_leaf_blight
fieldplant: {}
